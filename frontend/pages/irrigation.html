<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Recommendation — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">AI Module</div>
        <h1>Smart Irrigation</h1>
      </div>
    </div>

    <div class="card fade-in-up" style="padding:28px; max-width:640px; margin-bottom:24px;">
      <p style="color:var(--color-text-dim); font-size:0.9rem; margin-bottom:20px;">
        Get an irrigation recommendation based on your soil moisture, crop type, and live weather forecast for your location.
      </p>

      <form id="irrigationForm" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="field">
          <label class="field-label">Crop Type</label>
          <select class="field-input" id="irrigCrop" required></select>
        </div>
        <div class="field">
          <label class="field-label">Soil Type</label>
          <select class="field-input" id="irrigSoil" required></select>
        </div>
        <div class="field">
          <label class="field-label">Current Soil Moisture (%)</label>
          <input class="field-input" type="number" step="any" min="0" max="100" id="irrigMoisture" placeholder="e.g. 20" required>
        </div>
        <div class="field">
          <label class="field-label">Farm Location</label>
          <input class="field-input" type="text" id="irrigLocation" placeholder="e.g. Tindivanam" required>
        </div>

        <button type="submit" class="btn btn-primary" style="grid-column: span 2;" id="irrigSubmitBtn">Get Recommendation</button>
      </form>
    </div>

    <div id="irrigResult"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/irrigation.js"></script>
<script>initAppShell("irrigation").then(loadIrrigationOptions);</script>
</body>
</html>
