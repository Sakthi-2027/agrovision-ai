<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Recommendation — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">AI Module</div>
        <h1>Weather Forecast</h1>
      </div>
    </div>

    <div class="card fade-in-up" style="padding:24px; margin-bottom:24px;">
      <form id="weatherForm" style="display:flex; gap:12px; align-items:flex-end;">
        <div class="field" style="flex:1; margin-bottom:0;">
          <label class="field-label">Location</label>
          <input class="field-input" type="text" id="locationInput" placeholder="e.g. Tindivanam" value="Tindivanam" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:auto; padding:13px 28px;" id="weatherBtn">Get Forecast</button>
      </form>
    </div>

    <div id="weatherResults"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/weather.js"></script>
<script>initAppShell("weather");</script>
</body>
</html>
