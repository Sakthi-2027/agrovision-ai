<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">Insights</div>
        <h1>Analytics</h1>
      </div>
    </div>

    <div class="stats-grid fade-in-up" id="analyticsStats"></div>

    <div class="analytics-grid fade-in-up">
      <div class="card chart-card">
        <h3>Crop Distribution</h3>
        <canvas id="cropChart"></canvas>
      </div>
      <div class="card chart-card">
        <h3>Disease Severity Breakdown</h3>
        <canvas id="severityChart"></canvas>
      </div>
    </div>

    <div class="card fade-in-up" style="padding:24px;">
      <h3 style="margin-bottom:16px;">Recent Activity</h3>
      <div class="activity-list" id="recentActivity"></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/analytics.js"></script>
<script>initAppShell("analytics").then(loadAnalytics);</script>
</body>
</html>
