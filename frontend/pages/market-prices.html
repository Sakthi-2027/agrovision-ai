<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Recommendation — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">AI Module</div>
        <h1>Market Prices</h1>
      </div>
    </div>

    <div class="card fade-in-up" style="padding:20px; margin-bottom:12px;">
      <div class="card fade-in-up" style="padding:10px 16px; margin-bottom:12px; border-color:var(--color-amber); background:rgba(224,169,76,0.08);">
        <p style="font-family:var(--font-mono); font-size:0.75rem; color:var(--color-amber);">
          ⚠️ DEMO DATA — Sample prices for demonstration. Live sync requires a valid API key.
        </p>
      </div>

      <form id="marketForm" style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
        <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
          <label class="field-label">State</label>
          <input class="field-input" type="text" id="stateInput" placeholder="e.g. Tamil Nadu">
        </div>
        <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
          <label class="field-label">Commodity</label>
          <input class="field-input" type="text" id="commodityInput" placeholder="e.g. Onion">
        </div>
        <button type="submit" class="btn btn-primary" style="width:auto; padding:13px 28px;">Search</button>
      </form>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:0.85rem; color:var(--color-text-faint);" id="resultCount"></span>
      <span style="font-family:var(--font-mono); font-size:0.75rem; color:var(--color-text-faint);" id="lastSynced"></span>
    </div>

    <div style="overflow-x:auto; width:100%;" id="marketResults"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/market.js"></script>
<script>initAppShell("market-prices").then(() => searchMarketPrices());</script>
</body>
</html>
