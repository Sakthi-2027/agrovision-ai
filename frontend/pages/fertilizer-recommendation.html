<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This module needs your dataset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">AI Module</div>
        <h1>Fertilizer Recommendation</h1>
      </div>
    </div>

    <div class="card fade-in-up" style="padding:28px; max-width:640px; margin-bottom:24px;">
      <p style="color:var(--color-text-dim); font-size:0.9rem; margin-bottom:20px;">
        Enter your soil and crop conditions to get an AI-recommended fertilizer.
      </p>

      <form id="fertilizerForm" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="field">
          <label class="field-label">Soil Type</label>
          <select class="field-input" id="soilType" required></select>
        </div>
        <div class="field">
          <label class="field-label">Crop Type</label>
          <select class="field-input" id="cropType" required></select>
        </div>
        <div class="field">
          <label class="field-label">Temperature (°C)</label>
          <input class="field-input" type="number" step="any" id="fTemperature" placeholder="e.g. 26" required>
        </div>
        <div class="field">
          <label class="field-label">Humidity (%)</label>
          <input class="field-input" type="number" step="any" id="fHumidity" placeholder="e.g. 52" required>
        </div>
        <div class="field">
          <label class="field-label">Moisture</label>
          <input class="field-input" type="number" step="any" id="fMoisture" placeholder="e.g. 38" required>
        </div>
        <div class="field">
          <label class="field-label">Nitrogen (N)</label>
          <input class="field-input" type="number" step="any" id="fNitrogen" placeholder="e.g. 37" required>
        </div>
        <div class="field">
          <label class="field-label">Potassium (K)</label>
          <input class="field-input" type="number" step="any" id="fPotassium" placeholder="e.g. 0" required>
        </div>
        <div class="field">
          <label class="field-label">Phosphorous (P)</label>
          <input class="field-input" type="number" step="any" id="fPhosphorous" placeholder="e.g. 0" required>
        </div>

        <button type="submit" class="btn btn-primary" style="grid-column: span 2;" id="fertilizerSubmitBtn">Get Recommendation</button>
      </form>
    </div>

    <div id="fertilizerResult"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/fertilizer.js"></script>
<script>initAppShell("fertilizer-recommendation").then(loadFertilizerOptions);</script>
</body>
</html>
