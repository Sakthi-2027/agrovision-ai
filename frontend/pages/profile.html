<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">Account</div>
        <h1>Your Profile</h1>
      </div>
    </div>

    <div class="card fade-in-up" style="max-width:480px; padding:32px;">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:28px;">
        <div class="sidebar-avatar" style="width:56px;height:56px;font-size:1.3rem;" id="profileInitial">-</div>
        <div>
          <div style="font-family:var(--font-display); font-size:1.2rem; font-weight:600;" id="profileName">Loading...</div>
          <div style="font-family:var(--font-mono); font-size:0.72rem; color:var(--color-text-faint); text-transform:uppercase;" id="profileRole">-</div>
        </div>
      </div>

      <div class="auth-status" id="profileStatus"></div>

      <form id="profileForm">
        <div class="field">
          <label class="field-label">Full name</label>
          <input class="field-input" type="text" id="profileNameInput" required>
        </div>
        <div class="field">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" id="profileEmailInput" disabled style="opacity:0.6; cursor:not-allowed;">
        </div>

        <div class="divider">Change password (optional)</div>

        <div class="field">
          <label class="field-label">Current password</label>
          <input class="field-input" type="password" id="currentPasswordInput" placeholder="Required only if changing password">
        </div>
        <div class="field">
          <label class="field-label">New password</label>
          <input class="field-input" type="password" id="newPasswordInput" placeholder="Leave blank to keep current password">
        </div>

        <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
      </form>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script>
  let currentProfileUser = null;

  initAppShell("profile").then(user => {
    currentProfileUser = user;
    document.getElementById("profileInitial").textContent = user.full_name.charAt(0).toUpperCase();
    document.getElementById("profileName").textContent = user.full_name;
    document.getElementById("profileRole").textContent = user.role;
    document.getElementById("profileNameInput").value = user.full_name;
    document.getElementById("profileEmailInput").value = user.email;
  });

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById("profileStatus");
    const saveBtn = document.getElementById("saveProfileBtn");

    const payload = {
      full_name: document.getElementById("profileNameInput").value.trim()
    };

    const newPassword = document.getElementById("newPasswordInput").value.trim();
    if (newPassword) {
      payload.new_password = newPassword;
      payload.current_password = document.getElementById("currentPasswordInput").value;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    statusEl.textContent = "";

    try {
      const result = await AuthAPI.updateProfile(payload);
      statusEl.textContent = "Profile updated successfully.";
      statusEl.className = "auth-status success";
      document.getElementById("profileName").textContent = result.user.full_name;
      document.getElementById("profileInitial").textContent = result.user.full_name.charAt(0).toUpperCase();
      document.getElementById("currentPasswordInput").value = "";
      document.getElementById("newPasswordInput").value = "";
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = "auth-status error";
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
    }
  });
</script>
</body>
</html>
