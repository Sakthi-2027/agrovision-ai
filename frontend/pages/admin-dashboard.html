<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — AgroVision AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main-content">
    <div class="main-topbar fade-in-up">
      <div>
        <div class="eyebrow">Administration</div>
        <h1>Admin Dashboard</h1>
      </div>
    </div>

    <div class="stats-grid fade-in-up" id="adminStats"></div>

    <div class="section-heading fade-in-up">
      <h2>Registered Farmers</h2>
      <span id="farmerCount"></span>
    </div>

    <div class="card fade-in-up" style="padding:0; overflow-x:auto; margin-bottom:32px;">
      <table class="admin-table" id="farmersTable"></table>
    </div>

    <div class="section-heading fade-in-up">
      <h2>Datasets</h2>
      <span>ml/datasets/raw</span>
    </div>

    <div class="card fade-in-up" id="datasetsCard" style="padding:24px;"></div>
  </main>
</div>
<div class="section-heading fade-in-up" style="margin-top:32px;">
  <h2>Market Prices</h2>
  <span>data.gov.in sync</span>
</div>

<div class="card fade-in-up" style="padding:24px;">
  <p style="color:var(--color-text-dim); font-size:0.9rem; margin-bottom:16px;">
    Manually trigger a fresh sync of market prices from data.gov.in into the local database.
    The market prices page serves data from this local cache — sync whenever you want fresh data.
  </p>
  <button class="btn btn-primary btn-icon-inline" id="syncMarketBtn" onclick="syncMarketPrices()">Sync Market Prices</button>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/admin.js"></script>
<script>
  initAppShell("admin").then(user => {
    if (user.role !== "admin") {
      alert("This page is restricted to admin accounts.");
      window.location.href = "dashboard.html";
      return;
    }
    loadAdminDashboard();
  });
</script>
</body>
</html>
